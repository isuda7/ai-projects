<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Vibe Design System - Elevator Guide</title>
  <link rel="stylesheet" href="/assets/css/guide.css">
  <style>
    .elevator_swatch_group {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .elevator_swatch {
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .elevator_box {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      background-color: white;
      margin-bottom: 16px;
      border: 1px solid var(--color-gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .elevator_name {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-gray-900);
    }

    .elevator_var {
      font-size: 11px;
      color: var(--color-gray-500);
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div data-include="/guide/layout/header.html"></div>
  <div class="guide_main_container">
    <div data-include="/guide/layout/sidebar.html"></div>
    <main class="guide_content">
      <div class="guide_wrapper">
        <header class="guide_header">
          <h1 class="guide_title_h1">Elevator Foundation</h1>
          <p class="guide_description">
            Z축의 깊이감을 표현하기 위한 Box Shadow 규격입니다.
          </p>
        </header>
        <section class="guide_section">
          <h2 class="guide_title_h2">Shadow Scales</h2>
          <div class="elevator_swatch_group">
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-none)">Flat</div>
              <span class="elevator_name">Level 0</span>
              <span class="elevator_var">--elevator-none</span>
            </div>
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-1); border-color: transparent;">Button</div>
              <span class="elevator_name">Level 1</span>
              <span class="elevator_var">--elevator-1</span>
            </div>
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-2); border-color: transparent;">Card /
                Dropdown</div>
              <span class="elevator_name">Level 2</span>
              <span class="elevator_var">--elevator-2</span>
            </div>
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-3); border-color: transparent;">Modal</div>
              <span class="elevator_name">Level 3</span>
              <span class="elevator_var">--elevator-3</span>
            </div>
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-4); border-color: transparent;">Dialog /
                Popover</div>
              <span class="elevator_name">Level 4</span>
              <span class="elevator_var">--elevator-4</span>
            </div>
            <div class="elevator_swatch">
              <div class="elevator_box" style="box-shadow: var(--elevator-5); border-color: transparent;">Overlay</div>
              <span class="elevator_name">Level 5</span>
              <span class="elevator_var">--elevator-5</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
</body>

</html>
