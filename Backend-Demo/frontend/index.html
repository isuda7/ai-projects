<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Dashboard - Backend Convention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i data-lucide="server"></i>
          <h1>Demo</h1>
        </div>
      </div>
      
      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <i data-lucide="list"></i> 게시판 (Board)
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="/" class="back-link">
          <i data-lucide="arrow-left"></i> 커리큘럼으로 돌아가기
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <h2>게시판 관리</h2>
        <div class="header-actions">
          <button class="btn btn-primary" id="btn-create">
            <i data-lucide="plus"></i> 새 글 쓰기
          </button>
        </div>
      </header>

      <div class="content-container">
        
        <!-- View 1: List View -->
        <div id="view-list" class="view-section">
          <div class="section-header">
            <h3>최근 게시글 목록</h3>
            <p class="text-muted">실제 DB와 연동되어 데이터를 불러옵니다.</p>
          </div>
          <div class="card">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>작성일</th>
                    <th class="text-right">관리</th>
                  </tr>
                </thead>
                <tbody id="board-tbody">
                  <tr>
                    <td colspan="5" class="empty-state">
                      <i data-lucide="inbox"></i>
                      <p>등록된 게시글이 없습니다.</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- View 2: Detail View -->
        <div id="view-detail" class="view-section hidden">
          <div class="section-header flex-between">
            <h3 id="view-title">게시글 제목</h3>
            <button class="btn btn-secondary btn-back"><i data-lucide="arrow-left"></i> 목록으로</button>
          </div>
          <div class="card detail-card">
            <div class="post-meta">
              <span class="meta-item"><i data-lucide="user"></i> <span id="view-author">작성자</span></span>
              <span class="meta-item"><i data-lucide="calendar"></i> <span id="view-date">작성일</span></span>
            </div>
            <div class="post-content" id="view-content">
              게시글 내용이 여기에 표시됩니다.
            </div>
          </div>
        </div>

        <!-- View 3: Form View (Create/Edit) -->
        <div id="view-form" class="view-section hidden">
          <div class="section-header flex-between">
            <h3 id="edit-modal-title">새 글 쓰기</h3>
            <button class="btn btn-secondary btn-back"><i data-lucide="arrow-left"></i> 목록으로</button>
          </div>
          <div class="card form-card">
            <form id="edit-form">
              <input type="hidden" id="edit-id" />
              
              <div class="form-group">
                <label for="edit-title">제목</label>
                <input type="text" id="edit-title" class="form-control" placeholder="게시글 제목을 입력하세요" required />
              </div>
              
              <div class="form-group" id="author-group">
                <label for="edit-author">작성자</label>
                <input type="text" id="edit-author" class="form-control" placeholder="작성자 이름" required />
              </div>
              
              <div class="form-group">
                <label for="edit-content">내용</label>
                <textarea id="edit-content" class="form-control" rows="15" placeholder="게시글 내용을 입력하세요" required></textarea>
              </div>
              
              <div class="form-group" id="secret-group">
                <label for="edit-secret">게시글 비밀번호 <span class="text-muted">(수정/삭제 시 필요)</span></label>
                <input type="password" id="edit-secret" class="form-control" placeholder="비밀번호를 입력하세요 (4자리 이상)" required />
              </div>
              
              <div class="form-actions">
                <button type="button" class="btn btn-secondary btn-cancel">취소</button>
                <button type="button" class="btn btn-primary" id="edit-btn-save">저장하기</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
