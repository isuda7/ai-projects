<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>파이썬 시작 및 AI 협업 가이드 (Python Convention)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- PrismJS Theme for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Top Header Navigation -->
    <header class="top-header">
      <div class="logo">
        <i data-lucide="terminal-square"></i>
        <h1>Python Guide</h1>
      </div>
      <nav class="top-nav">
        <button class="tab-btn active" data-tab="overview"><i data-lucide="layout-dashboard"></i> 아키텍처 개요</button>
        <button class="tab-btn" data-tab="workflow"><i data-lucide="map"></i> 전체 워크플로우</button>
        <button class="tab-btn" data-tab="practical"><i data-lucide="terminal"></i> 실전 커리큘럼</button>
        <button class="tab-btn" data-tab="ai"><i data-lucide="bot"></i> AI 커리큘럼</button>
      </nav>
      <div class="mobile-menu-btn" id="mobile-menu-btn">
        <i data-lucide="menu"></i>
      </div>
    </header>

    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <nav class="nav-menu" id="nav-menu">
          <!-- Dynamically populated by JS -->
        </nav>
        <div class="sidebar-footer">
          <p>Python Convention & Workflow Guide</p>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div class="content-container" id="content-container">
          <!-- Content dynamically rendered here -->
        </div>
      </main>
    </div>

    <!-- External scripts for Icons and Syntax Highlighting -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
