const $ = s => document.querySelector(s);
const tag = k => `<span class="tag" data-k="${k}">${k}</span>`;
const cid = code => 'c' + code;

function renderNav(active){
  let h = `<a class="top-link" href="#map"${active==='map'?' aria-current="page"':''}>전체 지도</a>`;
  let m = '';
  for(const a of AREAS){
    h += `<a class="top-link" href="#a${a.id}"${active==='a'+a.id?' aria-current="page"':''}><b>${a.id}</b>${a.name}</a>`;
    m += `<div class="mega-col"><a class="area-link" href="#a${a.id}"${active==='a'+a.id?' aria-current="page"':''}><b>${a.id}</b><span>${a.name}</span></a><ul class="subs">`;
    for(const it of a.items) m += `<li><a href="#${cid(it.code)}"><span>${it.code} ${it.name.replace('프롬프트 ','')}</span>${tag(it.kind)}</a></li>`;
    m += `</ul></div>`;
  }
  $('#nav').innerHTML = h;
  $('#megaCols').innerHTML = m;
}

function renderItem(it){
  let body = '';
  if(it.kind==='설명'){
    body = '<dl class="desc">' + it.entries.map(e=>`<dt>${e[0]}</dt><dd>${e[1]}</dd>`).join('') + '</dl>';
  } else if(it.kind==='순서'){
    body = '<ol class="flow">' + it.entries.map(e=>`<li><h3>${e[0]}</h3><p>${e[1]}</p></li>`).join('') + '</ol>';
  } else if(it.kind==='단계'){
    const n = it.entries.length;
    body = '<ol class="stairs">' + it.entries.map((e,i)=>`<li><b>${i+1}단계</b><h3>${e[0]}</h3><p>${e[1]}</p></li>`).join('') + '</ol>';
  } else if(it.table){
    body = '<div class="table-wrap"><table><thead><tr>' + it.table.map(t=>`<th scope="col">${t}</th>`).join('') + '</tr></thead><tbody>' +
      it.entries.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('') + '</tbody></table></div>';
  } else {
    body = '<div class="cards">' + it.entries.map(e=>`<div class="card"><h3>${e[0]}</h3><p>${e[1]}</p></div>`).join('') + '</div>';
  }
  return `<section class="block" id="${cid(it.code)}">
    <div class="block-head"><span class="code">${it.code}</span><h2>${it.name}</h2>${tag(it.kind)}</div>
    <p class="basis">${it.basis}</p>${body}${it.tip?`<div class="note">${it.tip}</div>`:''}</section>`;
}

function renderArea(a){
  let h = `<div class="view"><p class="code">영역 ${a.id}</p><h1>${a.q}</h1><p class="lead">${a.intro}</p>`;
  h += a.items.map(renderItem).join('');
  if(a.workflow){
    const w = a.workflow;
    h += `<section class="block" id="wf"><div class="block-head"><h2>${w.title}</h2>${tag('순서')}</div><p class="basis">${w.desc}</p>
      <ol class="flow">${w.steps.map(s=>`<li><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join('')}</ol><div class="note">${w.tip}</div></section>`;
  }
  if(a.note) h += `<div class="note">${a.note}</div>`;
  const prev = AREAS.find(x=>x.id===a.id-1), next = AREAS.find(x=>x.id===a.id+1);
  h += `<nav class="pager" aria-label="영역 이동">${prev?`<a href="#a${prev.id}">← ${prev.id} ${prev.name}</a>`:'<a href="#map">← 전체 지도</a>'}${next?`<a href="#a${next.id}">${next.id} ${next.name} →</a>`:'<a href="#map">전체 지도 →</a>'}</nav></div>`;
  return h;
}

function renderMap(){
  let h = `<div class="view"><h1>프롬프트 전체 구조</h1><p class="lead">원리에서 한계까지, 프롬프트를 이미 써본 사람이 일반적인 작업에 쓰는 내용을 5개 영역 16개 기준으로 정리했습니다. 지도의 항목을 누르면 해당 내용으로 이동합니다.</p>`;
  h += `<div class="map" role="navigation" aria-label="마인드맵"><div class="root"><div>프롬프트</div></div><div class="branches">`;
  for(const a of AREAS){
    h += `<div class="branch"><a class="branch-head" href="#a${a.id}"><b>영역 ${a.id}</b><span>${a.name}</span><small>${a.q}</small></a>`;
    for(const it of a.items) h += `<a class="leaf" href="#${cid(it.code)}"><span>${it.code} ${it.name.replace('프롬프트 ','')}</span>${tag(it.kind)}</a>`;
    h += `</div>`;
  }
  h += `</div></div>`;
  h += `<section class="block" id="roadmap"><div class="block-head"><h2>로드맵</h2>${tag('순서')}</div><p class="basis">지도를 가로질러 익히는 순서입니다. 각 문장은 다음 단계로 넘어가는 완료 기준입니다.</p><ol class="road">` +
    ROAD.map(r=>`<li><b>${r[0]} · ${r[2]}</b><strong>${r[1]}</strong><p>${r[3]}</p></li>`).join('') + `</ol></section>`;
  h += `<section class="block" id="criteria"><div class="block-head"><h2>이 구조의 기준</h2></div><p class="basis">최소 기준(특정 상황 하나)과 최대 기준(입문용 정의·역사) 사이의 실무 표준입니다.</p>
    <div class="crit"><div class="card"><h3>대상</h3><p>프롬프트를 이미 써본 사용자</p></div><div class="card"><h3>범위</h3><p>특정 도구나 직무에 묶이지 않는 일반 프롬프트 작업</p></div><div class="card"><h3>포함 조건</h3><p>프롬프트의 결과나 판단에 직접 영향을 주는가</p></div></div>
    <ol class="rules">${RULES.map(r=>`<li><b>${r[0]}</b><span>${r[1]}</span></li>`).join('')}</ol></section>`;
  h += `<section class="block" id="bounds"><div class="block-head"><h2>경계 규칙</h2></div><p class="basis">겹치기 쉬운 개념은 한 곳에 고정하고, 다른 곳에서는 참조만 합니다.</p>
    <div class="table-wrap"><table><thead><tr><th scope="col">개념</th><th scope="col">주 위치</th><th scope="col">구분</th></tr></thead><tbody>${BOUNDS.map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join('')}</tbody></table></div></section>`;
  h += `<section class="block" id="howto"><div class="block-head"><h2>새 질문의 자리 찾기</h2>${tag('순서')}</div><p class="basis">어떤 질문이든 세 번 물으면 위치와 정리 방식이 정해집니다.</p>
    <ol class="flow"><li><h3>영역</h3><p>무엇에 대한 질문인가</p></li><li><h3>기준</h3><p>열여섯 기준 중 어디에 속하는가</p></li><li><h3>성격</h3><p>설명, 순서, 단계, 유형 중 무엇으로 정리하는가</p></li></ol>
    <div class="note">예: “시스템 프롬프트를 어떻게 테스트하나?” → 3 운영, 3-3 관리, 순서 성격이므로 워크플로우로 정리합니다. 어디에도 맞지 않으면 가지를 추가하고, 두 곳에 맞으면 경계를 다시 정합니다.</div></section></div>`;
  return h;
}

function route(){
  const t = (location.hash || '#map').slice(1);
  let view = 'map', target = null;
  if(/^a[1-5]$/.test(t)) view = t;
  else if(/^c[1-5]-[1-4]$/.test(t)) { view = 'a' + t[1]; target = t; }
  else if(['roadmap','criteria','bounds','howto'].includes(t)) { view = 'map'; target = t; }
  else if(t==='wf'){ view='a2'; target='wf'; }
  const main = $('#main');
  main.innerHTML = view==='map' ? renderMap() : renderArea(AREAS[+view[1]-1]);
  renderNav(view);
  document.title = view==='map' ? '프롬프트 전체 구조' : `${AREAS[+view[1]-1].id} ${AREAS[+view[1]-1].name} · 프롬프트 전체 구조`;
  const el = target && document.getElementById(target);
  if(el) el.scrollIntoView({block:'start',behavior:'instant'}); else window.scrollTo(0,0);
  closeMenu();
}
const side = $('#side'), btn = $('#menuBtn');
function closeMenu(){ side.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
side.addEventListener('mouseleave', ()=>side.classList.remove('closed'));
side.addEventListener('click', e=>{ if(e.target.closest('a')) side.classList.add('closed'); });
btn.addEventListener('click', ()=>{ const o = side.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)); });
$('#themeBtn').addEventListener('click', ()=>{
  const r = document.documentElement;
  const cur = r.dataset.theme || 'dark';
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem('theme', r.dataset.theme); }catch(e){}
});
try{ const s = localStorage.getItem('theme'); if(s) document.documentElement.dataset.theme = s; }catch(e){}
const syncOffset = ()=>{ document.documentElement.style.scrollPaddingTop = side.offsetHeight + 'px'; };
syncOffset();
new ResizeObserver(syncOffset).observe(side);
window.addEventListener('hashchange', route);
route();
if(document.fonts) document.fonts.ready.then(()=>{ const el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView({block:'start',behavior:'instant'}); });
</script>
</body>
</html>
